name: Build Android APK

# Мобильная сборка 1.0: buildozer работает только на Linux,
# поэтому APK собирается здесь (на Windows из build_mobile.py — только help).
# Артефакт: dist/*.apk (arm64-v8a + armeabi-v7a, minSdk 21).

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 0.2)"
        required: true
        type: string

jobs:
  build-android:
    name: Android APK release
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (for Android SDK/NDK)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libtinfo5 cmake \
            libffi-dev libssl-dev libltdl-dev \
            python3-pip python3-setuptools

      - name: Install buildozer + pinned cython
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "cython==0.29.36" buildozer

      - name: Sync version from tag
        env:
          RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', inputs.version) }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          sed -i "s/^version = .*/version = ${version}/" buildozer.spec
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"

      - name: Build APK with Buildozer
        run: |
          set -euo pipefail
          sdk_root="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROID_HOME="$sdk_root"
          export ANDROID_SDK_ROOT="$sdk_root"
          sdkmanager="$(find "$sdk_root" -type f -name sdkmanager -perm -111 -print -quit 2>/dev/null || true)"
          if [ -n "$sdkmanager" ]; then
            yes | "$sdkmanager" --sdk_root="$sdk_root" --licenses >/tmp/android-licenses.log || true
            yes | "$sdkmanager" --sdk_root="$sdk_root" "platform-tools" "platforms;android-33" "build-tools;33.0.2" >/tmp/android-packages.log
          fi
          buildozer android release

      - name: Prepare release asset
        run: |
          set -euo pipefail
          apk="$(find bin dist -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          mkdir -p dist
          cp "$apk" "dist/oko-service-tool-${RELEASE_TAG}.apk"

      - name: Verify packaged Python dependencies
        run: |
          set -euo pipefail
          apk="dist/oko-service-tool-${RELEASE_TAG}.apk"
          unzip -l "$apk" > /tmp/apk-files.txt
          for module in materialyoucolor materialshapes asynckivy asyncgui kivymd; do
            grep -Eq "/${module}(/|\\.pyc|\\.so)" /tmp/apk-files.txt
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: oko-service-tool-${{ env.RELEASE_TAG }}
          path: dist/oko-service-tool-${{ env.RELEASE_TAG }}.apk
          retention-days: 90
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: dist/oko-service-tool-${{ env.RELEASE_TAG }}.apk
