name: Build Android APK

# Мобильная сборка 1.0: buildozer работает только на Linux,
# поэтому APK собирается здесь (на Windows из build_mobile.py — только help).
# Артефакт: dist/*.apk (arm64-v8a + armeabi-v7a, minSdk 21).

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Android APK release
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (for Android SDK/NDK)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libtinfo5 cmake \
            libffi-dev libssl-dev libltdl-dev \
            python3-pip python3-setuptools

      - name: Install buildozer + pinned cython
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "cython==0.29.36" buildozer

      - name: Patch retired JCenter repository
        run: |
          if [ -d .buildozer ]; then
            find .buildozer -type f -name '*.gradle' -print0 | xargs -0 -r sed -i 's/jcenter()/mavenCentral()/g'
          fi

      - name: Sync version from tag
        run: sed -i "s/^version = .*/version = ${GITHUB_REF_NAME#v}/" buildozer.spec

      - name: Build APK with Buildozer
        run: |
          buildozer android release

      - name: Prepare release asset
        run: |
          set -euo pipefail
          apk="$(find bin dist -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          mkdir -p dist
          cp "$apk" "dist/oko-service-tool-${GITHUB_REF_NAME}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: oko-service-tool-${{ github.ref_name }}
          path: dist/oko-service-tool-${{ github.ref_name }}.apk
          retention-days: 90
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/oko-service-tool-${{ github.ref_name }}.apk
