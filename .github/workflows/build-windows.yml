name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt5 pyserial pyinstaller

      - name: Build with PyInstaller
        run: python build.py

      - name: Verify build output
        shell: cmd
        run: if exist dist\oko_manager\oko_manager.exe (echo OK) else (exit /b 1)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: oko-manager-windows
          path: dist/oko_manager/
          retention-days: 30
          if-no-files-found: error

  build-windows-legacy:
    runs-on: windows-latest
    name: Build (Legacy Compat)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt5==5.15.9 pyserial pyinstaller

      - name: Build with PyInstaller
        run: python build.py

      - name: Verify build output
        shell: cmd
        run: if exist dist\oko_manager\oko_manager.exe (echo OK) else (exit /b 1)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: oko-manager-windows-legacy
          path: dist/oko_manager/
          retention-days: 30
          if-no-files-found: error
